name: Storage Crawler Tests

on:
  push:
    paths:
      - "storage_crawler_python/**"
      - ".github/workflows/storage-crawler-tests.yml"
  pull_request:
    paths:
      - "storage_crawler_python/**"
      - ".github/workflows/storage-crawler-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: storage_crawler_python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
